{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>Appearance</h1></div><section class="card narrow"><h2>Theme</h2><p class="muted">Choose a look for your planner. This preference is saved for this browser session.</p><form method="post" class="form">{% csrf_token %}<label for="theme">Display mode</label><select id="theme" name="theme"><option value="system" {% if theme == 'system' %}selected{% endif %}>Follow device</option><option value="light" {% if theme == 'light' %}selected{% endif %}>Light</option><option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark</option></select><button class="button" type="submit">Save preference</button></form></section>{% endblock %}
