<!-- templates/households/edit_chore.html -->

{% extends "base.html" %}

{% block title %}Edit Chore | Student Project{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Edit Chore</p>
    <h1>{{ chore.title }}</h1>
    <p>Update this household chore.</p>

    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="button" type="submit">Save Changes</button>
        <a class="button secondary-button" href="{% url 'household_detail' household.id %}">Cancel</a>
    </form>
</section>
{% endblock %}
