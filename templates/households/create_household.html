<!-- templates/households/create_household.html -->

{% extends "base.html" %}

{% block title %}Create Household | Student Project{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">New Household</p>
    <h1>Create Household</h1>
    <p>Start a shared space for your roommates or housemates.</p>

    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="button" type="submit">Create Household</button>
        <a class="button secondary-button" href="{% url 'household_list' %}">Cancel</a>
    </form>
</section>
{% endblock %}
